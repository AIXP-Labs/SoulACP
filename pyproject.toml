[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulacp"
version = "0.2.0"
description = "Python ACP client library with native CLI sessions and bounded connection pooling"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    {name = "AIXP Labs", email = "noreply@SoulACP.dev"}
]
keywords = ["acp", "agent-client-protocol", "claude-code", "gemini", "opencode", "openclaw", "cursor", "codex", "qwen-code", "kimi", "codebuddy", "cline", "copilot", "minion", "vibe", "nova", "crow", "amp", "auggie", "autohand", "corust", "deepagents", "droid", "fast-agent", "copilot-ls", "goose", "junie", "kilo", "pi-acp", "qoder", "stakpak", "ai-agent", "coding-agent", "soulacp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4",
    "pytest-cov>=5.0",
    "ruff>=0.15.22",
    "pyright>=1.1.390",
    "build>=1.2.1",
    "twine>=5.0",
    "bandit>=1.7.10",
    "pre-commit>=4.6.0",
    "tomli>=2.0",
    "opentelemetry-api>=1.44.0",
]
otel = ["opentelemetry-api>=1.44.0"]

[project.urls]
Homepage = "https://soulacp.dev"
Repository = "https://github.com/AIXP-Labs/SoulACP"
Issues = "https://github.com/AIXP-Labs/SoulACP/issues"
Documentation = "https://soulacp.dev"
Changelog = "https://github.com/AIXP-Labs/SoulACP/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["soulacp*"]

[tool.setuptools.package-data]
soulacp = ["py.typed"]

# --- Ruff ---
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF021", "RUF043"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# --- Pyright ---
[tool.pyright]
include = ["src/soulacp", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires an installed and authenticated external agent CLI",
]

# --- Coverage ---
[tool.coverage.run]
source = ["src/soulacp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 75
