name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Repository hooks
        run: pre-commit run --all-files
      - name: Ruff check
        run: ruff check src/soulacp/ tests/ examples/
      - name: Ruff format
        run: ruff format --check src/soulacp/ tests/ examples/
      - name: Pyright
        run: pyright
      - name: Verify public type completeness
        run: pyright --verifytypes soulacp --ignoreexternal
        env:
          PYTHONPATH: src
      - name: Bandit
        run: bandit -q -r src/soulacp
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install minimum supported development stack
        run: pip install -e ".[dev]" -c requirements-min.txt
      - name: Run tests with branch coverage
        run: pytest tests/ -W error -q --cov=soulacp --cov-report=term
      - name: Ruff check
        run: ruff check src/soulacp/ tests/ examples/
      - name: Ruff format
        run: ruff format --check src/soulacp/ tests/ examples/
      - name: Pyright
        run: pyright
      - name: Verify public type completeness
        run: pyright --verifytypes soulacp --ignoreexternal
        env:
          PYTHONPATH: src
      - name: Bandit
        run: bandit -q -r src/soulacp
      - name: Build and validate distributions
        run: python -m build && python -m twine check dist/*
      - name: Audit minimum development dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-min.txt

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: pytest tests/ -W error -v --cov=soulacp --cov-report=xml
