name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,hooks]"
      - name: Repository hooks
        run: make hooks HOOKS_PYTHON="$(command -v python)"
      - name: Ruff check
        run: ruff check src/soulacp/ tests/ examples/ tools/
      - name: Ruff format
        run: ruff format --check src/soulacp/ tests/ examples/ tools/
      - name: Pyright
        run: pyright
      - name: Verify public type completeness
        run: pyright --verifytypes soulacp --ignoreexternal
        env:
          PYTHONPATH: src
      - name: Bandit
        run: bandit -q -r src/soulacp
      - name: Build distributions
        run: python tools/build_release.py --outdir dist/ci-build
      - name: Validate distribution metadata
        run: python -m twine check dist/ci-build/*
      - name: Verify source distribution inputs
        run: python tools/check_sdist.py dist/ci-build/*.tar.gz
      - name: Audit minimum repository-hook dependencies
        run: |
          python -m pip install pip-audit==2.10.1 uv==0.7.21
          pip-audit -r requirements-hooks.txt
      - name: Audit frozen dependencies on Linux
        run: |
          uv export --no-config --frozen --all-extras --no-hashes --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/soulacp-lock-audit.txt"
          pip-audit -r "$RUNNER_TEMP/soulacp-lock-audit.txt"

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install minimum supported development stack
        run: pip install -e ".[dev]" -c requirements-min.txt
      - name: Run tests with branch coverage
        run: pytest tests/ -W error -q --cov=soulacp --cov-branch --cov-report=term
      - name: Ruff check
        run: ruff check src/soulacp/ tests/ examples/ tools/
      - name: Ruff format
        run: ruff format --check src/soulacp/ tests/ examples/ tools/
      - name: Pyright
        run: pyright
      - name: Verify public type completeness
        run: pyright --verifytypes soulacp --ignoreexternal
        env:
          PYTHONPATH: src
      - name: Bandit
        run: bandit -q -r src/soulacp
      - name: Build and validate distributions
        run: python tools/build_release.py --outdir dist/ci-minimum
      - name: Audit minimum development dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements-min.txt

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: pytest tests/ -W error -v --cov=soulacp --cov-branch --cov-report=xml
